    <script>
      (function () {
        var NativeWS = window.WebSocket;
        if (!NativeWS) return;
        function GuardedWebSocket(url, protocols) {
          var protoStr = Array.isArray(protocols)
            ? protocols.join(',')
            : String(protocols || '');
          if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
            var fake = {
              url: String(url || ''),
              protocol: protoStr,
              readyState: 1,
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              onopen: null,
              onerror: null,
              onclose: null,
              onmessage: null,
              send: function () {},
              close: function () {
                this.readyState = 3;
              },
              addEventListener: function (type, listener) {
                if (type === 'open' && typeof listener === 'function') {
                  setTimeout(function () {
                    try {
                      listener(new Event('open'));
                    } catch (_) {}
                  }, 0);
                }
              },
              removeEventListener: function () {},
              dispatchEvent: function () {
                return true;
              },
            };
            setTimeout(function () {
              if (typeof fake.onopen === 'function') {
                try {
                  fake.onopen(new Event('open'));
                } catch (_) {}
              }
            }, 0);
            return fake;
          }
          return protocols !== undefined
            ? new NativeWS(url, protocols)
            : new NativeWS(url);
        }
        GuardedWebSocket.prototype = NativeWS.prototype;
        GuardedWebSocket.CONNECTING = NativeWS.CONNECTING;
        GuardedWebSocket.OPEN = NativeWS.OPEN;
        GuardedWebSocket.CLOSING = NativeWS.CLOSING;
        GuardedWebSocket.CLOSED = NativeWS.CLOSED;
        window.WebSocket = GuardedWebSocket;
      })();
    </script>
